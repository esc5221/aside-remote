  deleteConfirm.innerHTML = LOADING_ICON + '삭제 중…'; deleteError.hidden = true; render();
  try {
    await api('/api/sessions/' + encodeURIComponent(session.id), { method: 'DELETE' });
    deleteDialog.close();
    removeSession(session.id);
  } catch (e) {
    let message = e.message;
    try { message = JSON.parse(e.body).detail || message; } catch {}
    deleteError.textContent = message; deleteError.hidden = false;
  } finally {
    S.deletingId = null; deleteConfirm.disabled = false; deleteCancel.disabled = false;
    deleteConfirm.innerHTML = deleteButton; render();
  }
};

function send(prompt) {
  if (S.deletingId && S.deletingId === S.sessionId) return;
  const pending = S.atts.filter(a => !a.id).length;
  if (pending) { S.err = '이미지 업로드 중입니다…'; render(); return; }
  const attachments = S.atts.filter(a => a.id).map(a => ({ id: a.id, name: a.name }));
  if ((!prompt.trim() && !attachments.length) || !ws || ws.readyState !== 1) return;
  S.err = null;
  S.pending = prompt; S.pendingAtts = attachments.map(a => a.id);
  S.running = true;
  S.atts.forEach(a => a.preview?.startsWith('blob:') && URL.revokeObjectURL(a.preview));
  S.atts = []; renderAtts();
  S.holdTurn = true;              // 응답이 끝나도 스페이서를 유지 (걷으면 스크롤이 튄다)
  render();
  const sc = $('#chatScroll');
  requestAnimationFrame(() => sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' }));
  ws.send(JSON.stringify(S.sessionId
    ? { op: 'continue', sessionId: S.sessionId, prompt, attachments }
    : { op: 'run', prompt, attachments }));
}

// ─────────────────────────────────────────────── WebSocket
let ws = null, backoff = 0;
function sendWhenConnected(message) {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
}
function connect() {
  if (!S.token) return;
  try { ws?.close(); } catch {}
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  ws = new WebSocket(url);
  ws.onopen = () => { backoff = 0; S.wsOpen = true; render();
    if (S.sessionId) sendWhenConnected({ op: 'sub', sessionId: S.sessionId,
                                       fromSeq: S.nextSeq, fromOffset: S.offset }); };
  ws.onclose = () => { S.wsOpen = false; render();
    setTimeout(connect, Math.min(20000, 1000 * Math.pow(2, backoff++))); };
  ws.onerror = () => {};
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.op === 'ping') return;                      // 서버 하트비트(CF 100초 idle 회피)
    if (m.op === 'run.started') {
      S.running = true;
      // 초기화는 "새 대화가 세션을 얻었을 때"만. continue 에서도 지우면
      // 역사가 통째로 사라진다 (위로 튀는 스크롤의 정체가 이거였다).
      if (S.sessionId !== m.sessionId) {
        S.sessionId = m.sessionId; S.msgs = []; S.nextSeq = 0; S.offset = 0;
        localStorage.setItem('lastSession', m.sessionId);
        history.replaceState(curState(), '', urlOf(curState()));
      }
      loadSessions(); }
    else if (m.op === 'msg') {
      if (m.sessionId !== S.sessionId) return;
      if (m.message.role === 'user') { S.pending = null; S.pendingAtts = null; }
      const i = S.msgs.findIndex(x => x.seq === m.message.seq);
      if (i >= 0) S.msgs[i] = m.message; else S.msgs.push(m.message);
      S.nextSeq = Math.max(S.nextSeq, m.message.seq + 1);
    }
    else if (m.op === 'run.done') {
      if (m.sessionId === S.sessionId) {
        S.running = false;
        if (S.pending) {          // 유저 메시지가 스트림에 안 실렸다 = 시작 실패
          const out = (m.output || m.error || '').trim();
          S.err = /Session not found/i.test(out)
            ? '이 대화는 이어쓸 수 없습니다 — Aside 데몬이 재시작되며 세션을 잊었습니다. 새 대화로 시작해주세요.'
            : (out || '실행이 시작되지 못했습니다');
          $('#draft').value = S.pending;   // 쓴 내용은 잃지 않게 초안으로 되돌린다
          S.pending = null; S.pendingAtts = null;
          render(); return;   // 실행이 없었으니 목록도 안 바뀌었다.
                              // loadSessions 를 부르면 성공 시 S.err=null 로 방금 에러를 덮는다.
        }
      }
      loadSessions(); }
    else if (m.op === 'session.deleted') removeSession(m.sessionId);
    else if (m.op === 'error') { S.err = m.message || m.error; S.running = false; S.pending = null; }
    render();
  };
}

// ─────────────────────────────────────────────── 첨부
// 폰 카메라 원본은 5~12MB 라 그대로 올리면 느리고 에이전트가 볼 필요도 없다.
// 캔버스로 긴 변 1600px · JPEG q0.85 로 줄여서 올린다 (PNG 는 스크린샷일 수 있어 유지).
const MAX_EDGE = 1600;

function downscale(file) {
  return new Promise(resolve => {
    if (file.type === 'image/gif') return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
      if (scale === 1 && file.size < 1.5 * 1024 * 1024) return resolve(file);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const keepPng = file.type === 'image/png' && scale === 1;
      c.toBlob(b => resolve(b || file), keepPng ? 'image/png' : 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function renderAtts() {
  const el = $('#attachRow');
  el.innerHTML = S.atts.map((a, i) => `
    <div class="att${a.id ? '' : ' up'}">
      <img src="${esc(a.preview)}" alt="">
      <button class="x" data-i="${i}" aria-label="${esc(a.name || '이미지')} 첨부 제거">${icon(ICONS.close)}</button>
    </div>`).join('');
  el.querySelectorAll('.x').forEach(b => b.onclick = () => {
    const a = S.atts[+b.dataset.i];
    if (a?.preview?.startsWith('blob:')) URL.revokeObjectURL(a.preview);
    S.atts.splice(+b.dataset.i, 1); renderAtts();
  });
}

async function addFiles(files) {
  for (const f of [...files].slice(0, 6)) {
    if (!/^image\//.test(f.type)) continue;
    const slot = { preview: URL.createObjectURL(f), id: null, name: f.name || 'image' };
    S.atts.push(slot); renderAtts();
    try {
      const blob = await downscale(f);
      const r = await fetch('/api/upload', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + S.token, 'X-Filename': encodeURIComponent(slot.name) },
        body: blob,
      });
      if (!r.ok) throw new Error(await r.text());
      const info = await r.json();
      slot.id = info.id; slot.path = info.path;
    } catch (e) {
      S.err = '이미지 업로드 실패: ' + (e.message || e);
      S.atts = S.atts.filter(x => x !== slot);
      render();
    }
    renderAtts();
  }
}

// 네이티브 앱이면 카메라/갤러리를 네이티브 시트로. 아니면 <input type=file>.
async function pickImage() {
  const Cam = window.Capacitor?.Plugins?.Camera;
  if (!Cam) { $('#filePick').click(); return; }
  try {
    const photo = await Cam.getPhoto({
      quality: 88, allowEditing: false, resultType: 'base64',
      source: 'PROMPT', width: MAX_EDGE, correctOrientation: true,
      promptLabelHeader: '이미지 첨부', promptLabelPhoto: '앨범에서 선택',
      promptLabelPicture: '카메라로 촬영', promptLabelCancel: '취소',
    });
    const bin = atob(photo.base64String);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], { type: 'image/' + (photo.format || 'jpeg') });
    await addFiles([new File([blob], 'camera.' + (photo.format || 'jpg'), { type: blob.type })]);
  } catch (e) {
    if (!/cancel/i.test(String(e?.message || e))) { S.err = '카메라 실패: ' + (e.message || e); render(); }
  }
}

// ─────────────────────────────────────────────── 모바일 드로어
// 드로어의 열림/닫힘은 applyState 만 쓴다 — 직접 토글하면 히스토리와 어긋난다.
const drawerOpen = () => document.body.classList.contains('drawer');
const isMobile = () => innerWidth <= 820;

// ─────────────────────────────────────────────── 네이티브(Capacitor) 점진적 강화
// 앱은 server.url 로 이 페이지를 그대로 로드한다. Capacitor 가 브리지 스크립트를 주입하므로
// window.Capacitor 가 있으면 네이티브 기능을 쓸 수 있고, 없으면(=일반 브라우저) 조용히 넘어간다.
const native = () => !!(window.Capacitor?.isNativePlatform?.());

async function initNative() {
  if (!native()) return;
  document.documentElement.classList.add('native');
  const P = window.Capacitor.Plugins || {};

  // 안드로이드 하드웨어 백버튼: 앱을 종료하지 말고 화면 뒤로
  try {
    // 히스토리가 진실이므로 사다리가 필요 없다. 레이어든 화면이든 전부 엔트리로 쌓여 있다.
    await P.App?.addListener('backButton', ({ canGoBack }) =>
      canGoBack ? history.back() : P.App?.exitApp?.());
  } catch {}

  // 시스템 바 아이콘 명암을 테마에 맞춘다 (바 배경은 투명 → 웹 배경이 비친다)
  const syncBars = async () => {
    try {
      await P.SafeArea?.setSystemBarsStyle?.({ style: 'DARK' });
    } catch {}
  };
  syncBars();

  // 앱이 다시 앞으로 오면 상태를 새로 읽는다 (백그라운드 동안 실행이 끝났을 수 있다)
  try {
    await P.App?.addListener('appStateChange', ({ isActive }) => {
      if (!isActive) return;
      refreshAll();
      if (S.sessionId) pollRunning();
      if (ws?.readyState !== 1) connect();
    });
  } catch {}
}

// ─────────────────────────────────────────────── 이벤트
// ── 썸네일 로더 ────────────────────────────────────────────────────
// 살아있는 탭이 48개다. 한꺼번에 요청하면 브리지의 단일 REPL 락에 줄줄이 쌓여
// 탭 목록 조회까지 뒤로 밀린다(실제로 타임아웃남). 화면에 보이는 것만 3개씩 받는다.
const shotQueue = [];
let shotActive = 0;
function pumpShots() {
  while (shotActive < 3 && shotQueue.length) {
    const im = shotQueue.shift();
    if (!im.isConnected || im.dataset.loading) continue;
    im.dataset.loading = '1';
    shotActive++;
    const done = () => { shotActive--; pumpShots(); };
    im.addEventListener('load', done, { once: true });
    im.addEventListener('error', done, { once: true });
    im.src = im.dataset.src;
  }
}
const shotObserver = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    shotObserver.unobserve(e.target);
    shotQueue.push(e.target);
  }
  pumpShots();
}, { root: $('#list'), rootMargin: '200px' });

function observeThumbs() {
  $('#list').querySelectorAll('img.thumb[data-src]:not([data-seen])').forEach(im => {
    im.dataset.seen = '1';
    shotObserver.observe(im);
  });
}

// 썸네일 로드 실패(그새 잠든 탭 → 502/503)는 파비콘으로 대체한다.
// error 이벤트는 버블링하지 않으므로 캡처 단계로 받는다.
$('#list').addEventListener('error', e => {
  const im = e.target;
  if (!(im instanceof HTMLImageElement) || !im.classList.contains('thumb')) return;
  const fav = im.dataset.fav;
  const box = document.createElement('div');
  box.className = 'fav';
  if (fav) { const f = document.createElement('img'); f.src = fav; box.appendChild(f); }
  else box.innerHTML = icon(ICONS.globe);
  im.replaceWith(box);
}, true);

// 대화 안의 이미지가 끝내 안 열리는 경우 — 브리지가 서빙할 수 없는 경로
// (세션/업로드 디렉토리 밖의 로컬 파일)를 에이전트가 박았을 때다.
// 깨진 아이콘 대신 왜 안 보이는지와 원본 경로를 남긴다.
$('#msgs').addEventListener('error', e => {
  const im = e.target;
  if (!(im instanceof HTMLImageElement) || im.dataset.failed) return;
  im.dataset.failed = '1';
  const note = document.createElement('div');
  note.className = 'meta';
  note.textContent = `이미지를 불러올 수 없음 · ${im.getAttribute('src') || ''}`;
  im.replaceWith(note);
}, true);

// <details> 열림/닫힘을 기억한다 — 리렌더가 DOM 을 갈아엎어도 사용자가 펼쳐 둔 건 그대로 둔다.
$('#msgs').addEventListener('toggle', e => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.k) S.det.set(d.dataset.k, d.open);
}, true);

// 다이어그램 바(코드 토글·복사)도 위임 — #msgs 는 스트리밍마다 다시 그려진다.
$('#msgs').addEventListener('click', e => {
  const box = e.target.closest('.mmd');
  if (!box) return;
  const button = e.target.closest('button');
  if (!button) return;
  if (button.classList.contains('mtg')) {
    const show = box.classList.toggle('src');
    button.innerHTML = show ? DIAGRAM_BUTTON : CODE_BUTTON;
    if (show) mmdShowSrc.add(box.dataset.src); else mmdShowSrc.delete(box.dataset.src);
  } else if (button.classList.contains('mcp')) {
    navigator.clipboard.writeText(box.dataset.src);
    button.innerHTML = COPIED_BUTTON; setTimeout(() => button.innerHTML = COPY_BUTTON, 1200);
  }
});

// 목록 클릭은 위임으로 받는다 — 리스트가 다시 그려져도 핸들러가 사라지지 않는다.
$('#list').addEventListener('click', e => {
  if (e.target.closest('#more')) return loadSessions('more');
  const del = e.target.closest('.session-delete');
  if (del) {
    if (!del.disabled) confirmDelete(S.sessions.find(x => x.id === del.dataset.delete));
    return;
  }
  const card = e.target.closest('.card');
  if (card) return navigate({ view: 'chats', sessionId: card.dataset.id },
                            { replace: card.dataset.id === S.sessionId });
  const row = e.target.closest('.tabrow');
  if (row) return showTab(S.tabs.find(t => t.targetId === row.dataset.id), row);
});

let sqTimer = null;
$('#list').addEventListener('input', e => {
  if (e.target.id !== 'sq') return;
  S.sq = e.target.value;
  sqCaret = e.target.selectionStart;
  clearTimeout(sqTimer);
  sqTimer = setTimeout(() => navigate({ q: S.sq }, { replace: true }), 220);
});
$('#list').addEventListener('focusout', e => { if (e.target.id === 'sq') sqCaret = null; });

// 모바일에선 목록(드로어)까지 같은 엔트리에 담는다 — 엔트리 두 개로 쪼개면 back 이 두 번 필요해진다.
document.querySelectorAll('.seg').forEach(b => b.onclick = () =>
  navigate({ view: b.dataset.view, layer: isMobile() ? 'drawer' : undefined }));
$('#refresh').onclick = () => S.view === 'tabs' ? loadTabs(true) : refreshAll();
$('#browserPreview').onclick = showPreferredTab;
$('#newChat').onclick = newChat;
$('#attach').onclick = pickImage;
$('#filePick').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
// 붙여넣기·드래그로도 첨부되게
$('#draft').addEventListener('paste', e => {
  const imgs = [...(e.clipboardData?.files || [])].filter(f => /^image\//.test(f.type));
  if (imgs.length) { e.preventDefault(); addFiles(imgs); }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  const imgs = [...(e.dataTransfer?.files || [])].filter(f => /^image\//.test(f.type));
  if (imgs.length) { e.preventDefault(); addFiles(imgs); }
});
$('#menu').onclick = () => {
  if (isMobile()) return drawerOpen() ? closeLayer() : pushLayer('drawer');
  const hide = document.body.classList.toggle('sbhide');
  localStorage.setItem('sbhide', hide ? '1' : '');
};
if (localStorage.getItem('sbhide') === '1') document.body.classList.add('sbhide');
$('#scrim').onclick = () => closeLayer();   // 즉시 평가하면 const TDZ 에 걸린다
$('#send').onclick = () => {
  if (S.running) {
    // 주의: 이건 브리지의 로컬 CLI 만 끊는다. 데몬 쪽 에이전트 실행은 계속된다(실측).
    // 진짜 중단은 Aside 앱 UI 에서만 된다.
    ws?.send(JSON.stringify({ op: 'abort', sessionId: S.sessionId }));
    S.running = false;
    S.err = '스트리밍만 끊었습니다. 에이전트 실행 자체는 Aside 앱에서 중단해야 합니다.';
    render();
    setTimeout(() => { if (S.err && S.err.startsWith('스트리밍만')) { S.err = null; render(); } }, 8000);
    return;
  }
  const d = $('#draft'); send(d.value); d.value = ''; d.style.height = 'auto';
};
$('#draft').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(180, e.target.scrollHeight) + 'px';
});
// 엔터 = 전송, Shift(또는 Alt)+엔터 = 줄바꿈.
// ★한글 조합 중(isComposing / keyCode 229)의 엔터는 "조합 확정"이라 절대 전송하면 안 된다.
//   이걸 안 막으면 "안녕" 치고 엔터 누를 때 조합만 끝내려던 게 그대로 전송된다.
$('#draft').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.isComposing || e.keyCode === 229) return;
  if (e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;   // 줄바꿈
  e.preventDefault();
  $('#send').click();
});

// 부트스트랩: 토큰이 없으면 Access 로그인 사실을 근거로 브리지가 내려준다.
// (브리지가 cf-access-jwt-assertion 을 Cloudflare 공개키로 서명 검증한 뒤에만 준다)

async function boot() {
  // 매번 부른다. localStorage 에 토큰이 있어도 <img>/WS 가 쓰는 쿠키는 여기서만 심긴다.
  try {
    const r = await fetch('/api/web-token');
    if (r.ok) {
      const t = (await r.json()).token || '';
      if (t) { S.token = t; localStorage.setItem('token', t); }
    }
  } catch {}
  loadFonts();
  initNative();
  connect();

  history.scrollRestoration = 'manual';   // 브라우저 자동복원과 우리 복원이 싸운다

  const st = parseUrl();
  // URL 이 항상 이긴다. 예외는 하나 — 앱의 "/".
  // 웹의 "/" 는 명시적 목적지(= 새 대화)다. 북마크한 루트가 남의 마지막 대화를 열면 안 되고,
  // 그러면 "새 대화로 가는 주소" 자체가 없어진다.
  // 앱엔 주소창이 없어서 "/" 는 목적지가 아니라 그냥 앱이 켜진 것이다 → 마지막 대화 복원.
  if (native() && st.view === 'chats' && !st.sessionId && !location.search) {
    const last = localStorage.getItem('lastSession');
    if (last) st.sessionId = last;
  }
  history.replaceState(st, '', urlOf(st));   // 주소 정규화 (/c/x/ → /c/x 등)
  applyState(st);                            // 여기서 목록·대화·탭이 다 로드된다
  poll();
}
boot();
setInterval(poll, 30000);
</script>
