<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aside</title>
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icons/mark.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Aside">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1011">
<script defer src="/vendor/highlight.min.js"></script>
<script defer src="/vendor/lang-kotlin.min.js"></script>
<script defer src="/vendor/lang-swift.min.js"></script>
<script defer src="/vendor/lang-dockerfile.min.js"></script>
<script defer src="/vendor/lang-nginx.min.js"></script>
<script defer src="/vendor/lang-dart.min.js"></script>
<script defer src="/vendor/lang-lua.min.js"></script>
<script defer src="/vendor/lang-r.min.js"></script>
<script defer src="/vendor/lang-scala.min.js"></script>
<style>
/* 안드로이드 앱과 같은 웜뉴트럴 팔레트. 라이트가 기본, 다크는 시스템 설정을 따른다. */
:root{
  /* DESIGN.md owns the current theme; earlier palette notes are historical. */
  color-scheme:dark;
  /* 라이트 — claude.ai 계열 웜뉴트럴 */
  --bg:#0f1011; --surface:#141516; --surface2:#191a1b; --composer:var(--surface2);
  --text:#f7f8f8; --dim:#d0d6e0; --faint:#8a8f98;
  --line:#34343a; --line2:#23252a;
  --bubble:var(--surface2); --code-bg:var(--bg); --code-fg:var(--text); --code-line:var(--line2);
  --sbar:rgba(138,143,152,.28); --sbar-hi:rgba(138,143,152,.48);
  --code-bar:var(--surface2); --code-dim:var(--faint);
  --c-comment:var(--faint); --c-key:#a6a4f4; --c-str:#9cc8a2; --c-num:#d9b779;
  --c-fn:#8ab8d8; --c-type:var(--c-num); --c-attr:#c8a4d7; --c-meta:var(--dim);
  --accent:#5e6ad2; --accent-hover:#828fff; --accent-dim:var(--accent-hover);
  --err:#e5484d; --ok:#30a46c; --warn:#d9a54e;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px;
  --sidebar:300px; --touch-target:44px;
  --icon-size:16px; --icon-control:20px;
  --col:768px;          /* 메시지 컬럼 폭 = claude max-w-3xl */
  --colpad:var(--space-md);        /* px-4 */
  --composer-col:808px; /* claude max-w-[50.5rem] */
  --composer-pad:var(--space-lg);  /* md:px-5 */
  /* 본문 폰트. 설정에서 교체한다.
     윈도우엔 쓸 만한 한글 세리프가 없어(한글이 바탕체로 떨어진다) 웹폰트가 유일한 해결책이다. */
  --font-body:"Gowun Batang", ui-serif, Georgia, "Apple SD Gothic Neo", serif;
  --font-ui:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
            "Segoe UI", Roboto, sans-serif;
  /* 네이티브 앱(edge-to-edge)에서 시스템 바 뒤까지 웹뷰가 확장된다 → 실제 여백은 여기서 온다 */
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
    /* claude.ai 다크 실측: 배경 rgb(21,21,21) · 컴포저 rgb(32,32,31)
       · 본문 rgb(240,239,236) · 보조 hsl(55 9% 74%) · 말풍선 rgba(255,255,255,.05) */
*{box-sizing:border-box}
html,body{height:100%}
/* 키보드가 올라오며 리사이즈될 때 드러나는 창 배경이 흰색으로 번쩍이지 않게 */
html{background:var(--bg)}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.ri{display:inline-block;width:var(--icon-size);height:var(--icon-size);flex:0 0 auto;
    fill:currentColor;vertical-align:middle;pointer-events:none}
.ico .ri,.browser-preview-btn .ri,#attach .ri,#send .ri,.sheet-dismiss .ri{width:var(--icon-control);height:var(--icon-control)}
.btn,.seg,.codebar .cp,.mmd .mmdbar button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
a{color:var(--accent-hover)}
button,input,textarea,a,summary{transition:background-color .1s,border-color .1s,color .1s}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 레이아웃: 넓으면 2열, 좁으면 1열 ---------- */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh;height:100dvh;overflow:hidden}
#side{background:var(--surface);border-right:1px solid var(--line2);display:flex;flex-direction:column;min-width:0;min-height:0}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
/* 모바일: 대화가 기본 화면이고 목록은 햄버거로 여는 드로어다.
   예전엔 "데이터가 있나"로 사이드바/대화를 갈랐는데, 새 대화는 데이터가 없어서
   눌러도 사이드바로 튕겼다. 화면 전환을 데이터가 아니라 명시적 상태로 바꾼다. */
#scrim{display:none}
/* 데스크탑 사이드바 접기 — 내비게이션이 아니라 취향이므로 히스토리가 아닌 localStorage 에 둔다.
   display:none 만 쓰면 안 된다: 그리드 트랙(340px)이 남아 #main 이 첫 칸으로 들어가
   340px 폭에 구겨진다. 트랙 자체를 0 으로 접는다 (grid-template-columns 는 애니메이션 가능).
   접히는 동안 내용이 리플로우로 우그러지지 않게 자식 폭을 340px 로 고정하고 옆으로 잘려나가게 한다. */
@media (min-width:821px){
  #app{transition:grid-template-columns .15s cubic-bezier(.32,.72,0,1)}
  #side{overflow:hidden}
  #side > *{min-width:var(--sidebar)}
  body.sbhide #app{grid-template-columns:0px 1fr}
  body.sbhide #side{border-right:0;visibility:hidden;transition:visibility 0s .25s}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;top:0;bottom:0;left:0;z-index:40;
        width:min(86vw,var(--sidebar));background:var(--surface);border-right:1px solid var(--line2);
        transform:translateX(-100%);transition:transform .15s cubic-bezier(.32,.72,0,1)}
  body.drawer #side{transform:none;box-shadow:0 0 44px rgba(0,0,0,.45)}
  #scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);
         opacity:0;pointer-events:none;transition:opacity .22s}
  body.drawer #scrim{opacity:1;pointer-events:auto}
  #menu{display:inline-flex}
}

/* ---------- 헤더 ---------- */
.hd{display:flex;align-items:center;gap:var(--space-sm);min-height:48px;flex:0 0 auto;
    padding:calc(6px + var(--safe-top)) calc(var(--space-md) + var(--safe-right))
            6px calc(var(--space-md) + var(--safe-left));border-bottom:1px solid var(--line2)}
#side .hd{border-bottom:1px solid var(--line2)}
.hd h1{margin:0;font-size:18px;line-height:1.2;font-weight:600;font-family:var(--font-body)}
.hd .sub{font-size:11px;color:var(--faint)}
.hd .sp{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:0 0 auto}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.ico{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;
     padding:4px 6px;border-radius:var(--radius-sm);color:var(--dim);font-size:15px}
.ico:hover{background:var(--surface2)}
.browser-preview-btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.browser-preview-btn:disabled{opacity:.5;cursor:default}
@media (max-width:480px){
  .browser-preview-label{display:none}
  .btn.browser-preview-btn{padding:0;justify-content:center;min-width:var(--touch-target)}
}

/* ---------- 탭바 ---------- */
.segs{display:flex;gap:var(--space-xs);padding:var(--space-sm) var(--space-md) var(--space-xs)}
.seg{padding:4px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--faint);border:1px solid transparent}
@media (hover:none){
  .seg{padding:9px 14px;font-size:14px}
  .ico{padding:9px 10px}
  .card{padding:14px}
  .tabrow{padding:11px}
  #draft{font-size:16px}   /* iOS 는 16px 미만이면 포커스 시 확대한다 */
}
.seg.on{background:var(--surface2);color:var(--text);border-color:var(--line)}

/* ---------- 목록 ---------- */
.scroll{overflow-y:auto;flex:1;min-height:0}

/* ---------- 스크롤바 ----------
   macOS 는 트랙패드면 오버레이(자동 숨김)지만 마우스를 꽂는 순간 "항상 표시"로 바뀐다.
   그 기본 막대가 회색 청크로 튀어나와 카드 목록·컴포저의 둥근 톤과 안 맞는다.
   쉴 때는 투명, 그 영역에 마우스를 올릴 때만 떠오르게 한다.
   폭은 늘 예약해 두므로 나타날 때 레이아웃이 밀리지 않는다.
   반투명 토큰이라 밝은 카드 위에서도, 어두운 코드블록 위에서도 같은 농도로 보인다. */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}          /* Firefox */
*:hover{scrollbar-color:var(--sbar) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;
      background-clip:padding-box;border-radius:8px}
:hover::-webkit-scrollbar-thumb{background:var(--sbar);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--sbar-hi);background-clip:padding-box}
::-webkit-scrollbar-button{display:none;width:0;height:0}

/* 터치 기기엔 hover 가 없어 영영 안 뜬다 → 아예 지운다. 관성 스크롤이 위치를 알려준다. */
@media (hover:none){
  *{scrollbar-width:none;-ms-overflow-style:none}
  ::-webkit-scrollbar{width:0;height:0;display:none}
}
/* 오른쪽 여백이 1px 인 건 스크롤바가 11px 를 점유하기 때문이다 (합쳐서 왼쪽 12px 와 맞는다).
   안전영역은 좌우가 서로 바뀌어 있던 걸 바로잡았다 — 노치 폰 가로모드에서 반대편에 붙었다. */
#list{padding:0 calc(var(--space-md) + var(--safe-right)) var(--safe-bottom) calc(var(--space-md) + var(--safe-left));
      overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* 터치 기기는 막대 폭이 0 이라 보정이 필요 없다.
   #list 와 특이도가 같으므로 반드시 이 아래에 와야 이긴다. */
@media (hover:none){ #list{padding-right:calc(12px + var(--safe-right))} }
#chatScroll{display:flex;flex-direction:column}
.card{display:flex;width:100%;text-align:left;background:var(--surface2);border-radius:var(--radius-md);
      margin:var(--space-xs) 0;border:1px solid transparent}
.card:hover{border-color:var(--line)}
.card.on{border-color:var(--accent)}
.card-open{flex:1;min-width:0;text-align:left;padding:var(--space-sm);border-radius:var(--radius-md)}
.session-delete{align-self:flex-start;flex:0 0 36px;height:36px;margin:5px 5px 0 0;
                border-radius:8px;color:var(--faint)}
.session-delete:hover{color:var(--err);background:var(--surface2)}
.session-delete:disabled{opacity:.35;cursor:default}
.card .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.card .t span.txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .p{font-size:12px;color:var(--dim);margin-top:4px;overflow-wrap:anywhere;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:11px;color:var(--faint);margin-top:var(--space-xs);display:flex;gap:var(--space-sm)}
.unread{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* 목록: 검색 · 날짜 그룹 · 더보기.
   1000건을 한 번에 스크롤시키지 않는다 — 30건씩 명시적으로 불러온다.
   무한스크롤 대신 버튼인 이유: 스크롤 위치가 튀지 않고, 언제 끝났는지 사용자가 안다. */
.lsearch{position:sticky;top:0;z-index:2;background:var(--surface);padding:6px 0}
.lsearch input{width:100%;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--radius-sm);padding:7px 10px;font-size:13px;color:var(--text);outline:none;
      -webkit-appearance:none}
.lsearch input:focus{border-color:var(--accent)}
.grp{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.02em;
     padding:var(--space-md) var(--space-xs) 2px}
.grp:first-child{padding-top:4px}
.more{display:block;width:100%;margin:10px 0 4px;padding:12px;border-radius:10px;
      background:var(--surface);border:1px solid var(--line);color:var(--dim);font-size:13px}
.more:hover{border-color:var(--accent);color:var(--text)}
.more[disabled]{opacity:.5}
.listend{text-align:center;font-size:11px;color:var(--faint);padding:16px 0 10px}
@media (hover:none){ .more{padding:14px} }

/* ---------- 대화 ---------- */
/* 컬럼 폭: claude 는 메시지 max-w-3xl(768) + px-4, 컴포저 max-w-[50.5rem](808) + px-5.
   두 값이 만나 카드 폭이 정확히 메시지 컬럼과 맞물린다. 그 관계를 그대로 옮겼다. */
#msgs{width:100%;max-width:var(--col);margin:0 auto;
      padding:var(--space-lg) calc(var(--colpad) + var(--safe-right)) 0 calc(var(--colpad) + var(--safe-left));
      display:flex;flex-direction:column;min-width:0;flex:1 0 auto}
/* 턴 간격: claude 는 user→asst 52px, asst→user 68px. 여긴 툴 블록이 끼어드니 그보다 촘촘하게. */
#msgs > *{margin-top:7px}
.turn{display:flex;flex-direction:column;align-items:stretch}
.turn > * + *{margin-top:7px}
#msgs > .user{margin-top:24px}
#msgs > .user + *{margin-top:var(--space-lg)}
#msgs > :first-child{margin-top:0}

.user{align-self:flex-end;max-width:min(88%,620px);background:var(--bubble);
      border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);font-size:14px;line-height:20px;
      white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.user.pending{opacity:.5}
/* 어시스턴트는 말풍선 없음. 본문은 세리프. (claude: anthropic-serif 16px / 1.65) */
.asst{max-width:100%;min-width:0;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere;
      font-family:var(--font-body);font-size:15px;line-height:1.6}
.asst p{margin:0 0 var(--space-sm)}
.asst p:last-child{margin-bottom:0}
.asst h1,.asst h2,.asst h3{margin:16px 0 6px;font-weight:600;line-height:1.35}
.asst h1{font-size:20px}.asst h2{font-size:18px}.asst h3{font-size:16px}
.asst ul,.asst ol{margin:2px 0 var(--space-sm);padding-left:20px}
.asst li > ul,.asst li > ol{margin:3px 0}   /* 중첩 리스트는 아래 여백을 빼서 li 안에 밀착 */
.asst li{margin:3px 0}
.asst img{max-width:100%;border-radius:10px;background:var(--surface2);display:block;
          margin:8px 0;cursor:zoom-in}
.asst code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;
           background:var(--surface2);padding:1px 5px;border-radius:5px}
.asst hr{border:0;border-top:1px solid var(--line2);margin:14px 0}
.asst blockquote{margin:8px 0;padding:2px 0 2px 14px;border-left:2px solid var(--line);
                 color:var(--dim)}
.asst blockquote p:last-child{margin-bottom:0}
.asst table{border-collapse:collapse;margin:8px 0;font-size:14px;display:block;
            overflow-x:auto;max-width:100%;font-family:inherit}
.asst th,.asst td{border:1px solid var(--line2);padding:5px var(--space-sm);text-align:left;vertical-align:top}
.asst th{background:var(--surface2);font-weight:600;white-space:nowrap}

/* 코드블록: 절대배치 라벨 대신 헤더바를 따로 둔다 (본문과 겹치지 않게) */
.codewrap{margin:var(--space-sm) 0;border:1px solid var(--code-line);border-radius:var(--radius-md);overflow:hidden;
          background:var(--code-bg)}
.codebar{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 13px;
         background:var(--code-bar);border-bottom:1px solid var(--code-line);
         font-family:var(--font-ui)}
.codebar .lang{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
               color:var(--code-dim);flex:1;font-weight:600}
.codebar .cp{font-size:10.5px;color:var(--code-dim);padding:3px 8px;border-radius:6px;
             border:1px solid transparent}
.codebar .cp:hover{background:var(--code-line);color:var(--code-fg)}
pre.code{margin:0;padding:10px;overflow-x:auto;background:none}
.mmd{margin:8px 0;max-width:100%;border-radius:12px;overflow:hidden}
.mmd svg{max-width:100%;height:auto;display:block;margin:0 auto}
.mmd foreignObject{overflow:visible}   /* 측정이 1~2px 어긋나는 폰트에서도 글자를 안 자른다 */
.mmd .mview{display:none;overflow-x:auto;padding:14px;background:var(--surface)}
.mmd[data-done]{border:1px solid var(--line2)}
.mmd[data-done] .mview{display:block}
.mmd[data-done] .mmdsrc{display:none}
.mmd[data-done].src .mview{display:none}
.mmd[data-done].src .mmdsrc{display:block}
.mmd .mmdbar{display:none;align-items:center;gap:8px;padding:6px 10px 6px 13px;
             background:var(--code-bar);border-bottom:1px solid var(--code-line);
             font-family:var(--font-ui)}
.mmd[data-done] .mmdbar{display:flex}
.mmd .mmdbar .lang{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
                   color:var(--code-dim);flex:1;font-weight:600}
.mmd .mmdbar button{font-size:11px;color:var(--code-dim);padding:3px 8px;border-radius:6px;
                    border:1px solid transparent;background:none}
.mmd .mmdbar button:hover{background:var(--code-line);color:var(--code-fg)}
.mmd .mmdbar .ri{height:var(--icon-size);margin:0}
.mmd .mmdsrc{margin:0;font-size:12px;white-space:pre-wrap;word-break:break-word;
             background:var(--code-bg);padding:12px 13px;color:var(--code-fg)}
pre.code code{background:none;padding:0;color:var(--code-fg);
              font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
              font-size:13px;line-height:1.62;tab-size:2}

/* hljs 테마 — 앱 팔레트에 맞춰 직접 짠 것 (배포판 테마를 쓰면 톤이 튄다) */
.hljs-comment,.hljs-quote{color:var(--c-comment);font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section,.hljs-doctag,
.hljs-name,.hljs-strong{color:var(--c-key)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute,.hljs-meta .hljs-string{color:var(--c-str)}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-link{color:var(--c-num)}
.hljs-title,.hljs-title.function_,.hljs-built_in.function_{color:var(--c-fn)}
.hljs-built_in,.hljs-type,.hljs-class .hljs-title,.hljs-title.class_{color:var(--c-type)}
.hljs-attr,.hljs-variable,.hljs-template-variable,.hljs-property,
.hljs-selector-attr,.hljs-selector-pseudo{color:var(--c-attr)}
.hljs-meta,.hljs-comment .hljs-doctag,.hljs-params{color:var(--c-meta)}
.hljs-deletion{color:var(--err)}
.hljs-emphasis{font-style:italic}

/* 사고 / 툴 — 본문 세리프와 구분되게 산세리프, 작게 */
details.think,details.tool,details.res{font-family:inherit}
details.think,details.tool,details.res{font-size:13px}
details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;
                font-size:12.5px;padding:3px 2px;
                font-family:var(--font-ui)}
details summary::-webkit-details-marker{display:none}
.disclosure-icon{transition:transform .12s}
details[open] > summary > .disclosure-icon{transform:rotate(90deg)}
details.think summary{color:var(--faint);font-style:italic}
details.think .body{color:var(--faint);font-size:12.5px;padding:2px 0 4px 18px;white-space:pre-wrap;
                    font-family:var(--font-ui)}
details.tool summary{color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
      border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:500}
.chip .ri{color:var(--accent-dim)}
details.tool .body code,details.res .body code{background:none;padding:0;color:inherit;font-size:inherit}
details.tool .body,details.res .body{background:var(--code-bg);color:var(--code-fg);
      border:1px solid var(--code-line);border-radius:8px;
      padding:10px 12px;margin:5px 0;overflow:auto;max-height:340px;
      font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;
      word-break:break-word}
details.res summary{color:var(--dim)}
details.res.err summary{color:var(--err)}
details.res .body{background:var(--surface2);color:var(--dim);border-color:var(--line2)}
.meta{font-size:11px;color:var(--faint);display:flex;gap:9px;flex-wrap:wrap;min-width:0;
      overflow-wrap:anywhere;
      font-family:var(--font-ui)}
.sys{font-size:11.5px;color:var(--faint);overflow-wrap:anywhere;
     font-family:var(--font-ui)}

/* ---------- 입력 (seamless) ---------- */
/* 스크롤 컨테이너 안에서 sticky. 배경·보더·그림자 없음 —
   메시지가 카드 옆·아래로 그대로 지나가고, 구분선이라는 게 존재하지 않는다. */
/* 완전 투명하게 두면 스크롤한 본문이 카드 위아래로 비친다.
   하드 라인 대신 위쪽 32px 을 배경색으로 페이드아웃 → 경계 없이 자연스럽게 사라진다. */
#composerBar{position:sticky;bottom:0;z-index:5;padding-top:32px;margin-top:8px;
             pointer-events:none;
             background:linear-gradient(to bottom,
               rgba(0,0,0,0) 0, var(--bg) 30px, var(--bg) 100%)}
#composer{width:100%;max-width:var(--composer-col);margin:0 auto;pointer-events:auto;
          padding:0 calc(var(--composer-pad) + var(--safe-right)) calc(var(--space-md) + var(--safe-bottom))
                    calc(var(--composer-pad) + var(--safe-left))}
#composerCard{display:flex;flex-direction:column;gap:6px;background:var(--composer);
              border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-sm);
              transition:border-color .15s}
#composerCard:focus-within{border-color:var(--accent)}
/* 버튼과 같은 높이(36px)를 갖고, 한 줄일 때 글자가 세로 중앙에 오도록 (36-22)/2=7px */
.crow{display:flex;gap:8px;align-items:flex-end}
#draft{flex:1;resize:none;background:none;border:0;outline:none;
       padding:7px 0;max-height:180px;min-height:36px;min-width:0;
       font-size:14px;line-height:22px;color:var(--text)}
/* ＋ 도 전송 버튼과 같은 36px 원 — 좌우 대칭이 맞아야 통일감이 산다 */
#attach{width:36px;height:36px;border-radius:var(--radius-md);flex:0 0 auto;
        display:grid;place-items:center;font-size:19px;line-height:1;
        color:var(--dim);background:var(--surface2);transition:color .15s,background .15s}
#attach:hover{color:var(--text)}
#attachRow{display:flex;gap:8px;flex-wrap:wrap;padding:2px 2px 0 44px}
#attachRow:empty{display:none}
.att{position:relative;width:60px;height:60px;border-radius:10px;overflow:hidden;
     background:var(--surface2);border:1px solid var(--line)}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:9px;
        background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;padding:0}
.att.up{opacity:.45}
/* 유저 말풍선에 붙는 첨부 썸네일 */
.user .atts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.user .atts img{width:96px;height:96px;object-fit:cover;border-radius:9px;cursor:zoom-in;display:block}
#draft::placeholder{color:var(--faint)}
#send{width:36px;height:36px;border-radius:var(--radius-md);background:var(--accent);color:#fff;
      display:grid;place-items:center;font-size:14px;flex:0 0 auto;transition:opacity .15s}
#send:hover{background:var(--accent-hover)}
#send.stop{background:var(--surface2);color:var(--dim)}

.working{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:13px;
         font-family:var(--font-ui)}

/* ---------- 탭 ---------- */
.tabrow{display:flex;gap:var(--space-sm);align-items:center;background:var(--surface2);border-radius:var(--radius-md);
        padding:var(--space-sm);margin:var(--space-xs) 0;width:100%;text-align:left;border:1px solid transparent}
.tabrow:hover{border-color:var(--line)}
.thumb{width:72px;height:48px;border-radius:var(--radius-sm);background:var(--surface);object-fit:cover;flex:0 0 auto}
.fav{width:72px;height:48px;border-radius:var(--radius-sm);background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.fav img{width:18px;height:18px}
.tabrow .t{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tabrow .h{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0}
.tabrow .h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tabrow .h i{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.tabrow .h i.live{background:var(--ok)}
.searchbar{display:flex;gap:8px;padding:6px 0}
.searchbar input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
                 padding:7px 10px;outline:none}

/* ---------- 시트 / 모달 ---------- */
dialog.mask{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;
            margin:0;padding:12px max(12px,var(--safe-right)) max(12px,var(--safe-bottom))
            max(12px,var(--safe-left));border:0;background:transparent;color:var(--text);
            display:flex;align-items:flex-end;justify-content:center;z-index:50}
dialog.mask:not([open]){display:none}
dialog.mask::backdrop{background:#0008}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
       width:min(960px,100%);max-height:calc(100dvh - max(24px,var(--safe-top)) -
       max(12px,var(--safe-bottom)));display:flex;flex-direction:column;overflow:hidden;
       box-shadow:0 -12px 48px rgba(0,0,0,.28)}
.sheet-grip{width:42px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px}
.sheet-head{display:flex;align-items:flex-start;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--line2)}
.sheet-title{min-width:0;flex:1}
.sheet h3{margin:0 0 3px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .url{font-size:11px;color:var(--faint);word-break:break-all}
.sheet-scroll{overflow:auto;padding:var(--space-md) var(--space-md) calc(var(--space-md) + var(--safe-bottom));min-height:0}
.preview-frame{position:relative;min-height:180px;display:grid;place-items:center;background:var(--surface2);
               border:1px solid var(--line2);border-radius:var(--radius-md);overflow:hidden}
.preview-frame img.shot{display:block;width:100%;height:auto;max-height:58dvh;object-fit:contain;background:var(--surface2)}
.preview-frame img.shot[hidden]{display:none}
.preview-placeholder{padding:44px 20px;text-align:center;color:var(--faint);font-size:13px}
.preview-status{display:flex;align-items:center;gap:7px;min-height:22px;margin:8px 2px 2px;
                color:var(--faint);font-size:11px}
.preview-status.error{color:var(--err)}
.preview-tools{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.preview-tools .btn[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
.preview-tools + textarea{margin-top:10px}
.sheet-dismiss{flex:0 0 var(--touch-target);width:var(--touch-target);height:var(--touch-target);border-radius:var(--radius-md);color:var(--dim);
               display:grid;place-items:center}
.sheet-dismiss:hover{background:var(--surface2)}
.sheet textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);
                padding:var(--space-sm);min-height:64px;resize:vertical;outline:none}
.sheet textarea:focus,.btn:focus-visible,.ico:focus-visible,.sheet-dismiss:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);border-radius:var(--radius-md);padding:6px var(--space-md);font-size:13px;color:var(--dim)}
.btn:hover{background:var(--surface2)}
.sheet .btn{min-height:var(--touch-target)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-hover)}
.btn.danger{color:var(--err);border-color:var(--err)}
#deleteDialog{color:var(--text);background:var(--surface);border:1px solid var(--line);
              border-radius:var(--radius-lg);padding:var(--space-lg);width:min(420px,calc(100vw - 32px));
              max-height:calc(100dvh - 32px - var(--safe-top) - var(--safe-bottom));overflow:auto}
#deleteDialog::backdrop{background:#0008}
#deleteDialog h3{margin:0;font-size:17px}
#deleteTitle{overflow-wrap:anywhere;font-weight:600}
#deleteError{color:var(--err)}
#deleteDialog button:disabled{opacity:.5;cursor:default}
.zoom{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:60;cursor:zoom-out}
.zoom img{max-width:96vw;max-height:96vh}

/* ---------- 설정 / 기타 ---------- */
.pad{padding:var(--space-md) 2px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--faint);margin-bottom:4px}
.field input{width:100%;background:var(--surface);border:1px solid var(--line);
             border-radius:var(--radius-md);padding:7px 10px;outline:none}
.empty{padding:40px 24px;text-align:center;color:var(--faint);font-size:13px}
.fontgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.fontbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
         padding:var(--space-sm) 10px;border-radius:var(--radius-md);font-size:14px;color:var(--text);text-align:left}
.fontbtn.on{border-color:var(--accent);color:var(--accent)}
.fontbtn .fk{font-family:var(--font-ui);font-size:10px;color:var(--faint);font-weight:500}
.hint{font-size:11px;color:var(--faint);line-height:1.5;margin-top:7px;font-family:var(--font-ui)}
.err{color:var(--err);font-size:12.5px;width:100%;max-width:var(--col);
     margin:0 auto;padding:4px var(--colpad)}
.spin{color:var(--accent);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.working{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:12px}
@media (max-width:820px), (hover:none){
  .hd{min-height:56px}
  .ico,.seg,.btn,.session-delete,.more,.fontbtn,details summary,.codebar .cp,.mmd .mmdbar button{
    min-height:var(--touch-target)}
  .seg,.codebar .cp,.mmd .mmdbar button{min-width:var(--touch-target)}
  .ico{min-width:var(--touch-target)}
  .session-delete{flex-basis:var(--touch-target);height:var(--touch-target);margin:2px 2px 0 0}
  #attach,#send{width:var(--touch-target);height:var(--touch-target)}
  #draft{min-height:var(--touch-target);padding:11px 0}
  .lsearch input,.searchbar input,.field input{min-height:var(--touch-target)}
  .att .x{width:var(--touch-target);height:var(--touch-target);line-height:var(--touch-target);border-radius:var(--radius-sm)}
}
@media (hover:none){
  .lsearch input,.searchbar input,.field input,.sheet textarea,#draft{font-size:16px}
  .card{padding:0}
  .tabrow{padding:var(--space-sm)}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="scrim"></div>
<div id="app">
  <aside id="side">
    <div class="hd">
      <h1 id="sideTitle">대화</h1>
      <div class="sp"></div>
      <div class="dot" id="dot" title="연결 상태"></div>
      <button class="ico" id="refresh" title="새로고침" aria-label="새로고침" data-icon="refresh"></button>
    </div>
    <div class="segs">
      <button class="seg on" data-view="chats" data-icon="chats">대화</button>
      <button class="seg" data-view="tabs" data-icon="tabs">탭</button>
      <button class="seg" data-view="settings" data-icon="settings">설정</button>
    </div>
    <div class="scroll" id="list"></div>
  </aside>

  <section id="main">
    <div class="hd">
      <button class="ico" id="menu" title="목록" aria-label="목록" data-icon="menu"></button>
      <div style="min-width:0;flex:1">
        <div id="chatTitle" style="font-weight:600;font-size:15px;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap">새 대화</div>
      </div>
      <button class="btn browser-preview-btn" id="browserPreview" title="현재 브라우저 탭 미리보기" aria-label="브라우저 미리보기" data-icon="tabs">
        <span class="browser-preview-label">브라우저 미리보기</span>
      </button>
      <button class="ico" id="newChat" title="새 대화" aria-label="새 대화" data-icon="newChat"></button>
    </div>
    <div class="scroll" id="chatScroll">
      <div id="msgs"></div>
      <div class="err" id="chatErr"></div>
      <!-- 컴포저는 스크롤 컨테이너 "안"에 sticky 로 둔다.
           배경도 보더도 없어서 메시지가 그 아래로 그대로 지나간다 = 구분선이 없다. (claude.ai 방식) -->
      <div id="composerBar">
        <div id="composer">
          <div id="composerCard">
            <div id="attachRow"></div>
            <div class="crow">
              <button id="attach" title="이미지 첨부" aria-label="이미지 첨부" data-icon="attach"></button>
              <textarea id="draft" rows="1" placeholder="무엇을 시킬까요"
                        enterkeyhint="send"></textarea>
              <button id="send" title="보내기" aria-label="보내기" data-icon="send"></button>
            </div>
            <input id="filePick" type="file" accept="image/*" multiple hidden>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<dialog id="deleteDialog" aria-labelledby="deleteHeading" aria-describedby="deleteWarning">
  <h3 id="deleteHeading">대화를 삭제할까요?</h3>
  <p id="deleteTitle"></p>
  <p id="deleteWarning">Aside의 원본 대화와 대화에 저장된 파일도 삭제해요. 되돌릴 수 없어요.</p>
  <p id="deleteError" role="alert" hidden></p>
  <div class="acts">
    <button class="btn" id="deleteCancel" autofocus>취소</button>
    <button class="btn danger" id="deleteConfirm" data-icon="delete">삭제</button>
  </div>
</dialog>

<script>
'use strict';
// ─────────────────────────────────────────────── 상태
const S = {
  token: localStorage.getItem('token') || '',
  view: 'chats',
  sessions: [], tabs: [], msgs: [],
  sessionId: null, running: false, pending: null,
  nextSeq: 0, offset: 0,
  health: null, wsOpen: false, err: null, listErr: null,
  deletingId: null,
  q: '', liveOnly: false, det: new Map(),   // details 열림/닫힘 기억 (key → bool)
  sq: '', loadedQ: null, cursor: null, total: 0, matched: 0, loadingMore: false,
  font: localStorage.getItem('font') || 'gowun-batang', fonts: [],
  atts: [],
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON_SPRITE = '/vendor/remixicon.symbol.svg?v=4.9.1';
const ICONS = {
  menu:'menu-line', refresh:'refresh-line', tabs:'window-line', newChat:'add-line',
  attach:'image-add-line', send:'arrow-up-line', stop:'stop-fill', delete:'delete-bin-line',
  close:'close-line', pause:'pause-line', play:'play-line', agent:'robot-2-line',
  focus:'focus-3-line', open:'external-link-line', chats:'chat-3-line', settings:'settings-3-line',
  save:'save-3-line', shield:'shield-check-line', wake:'restart-line', copy:'file-copy-line',
  check:'check-line', code:'code-s-slash-line', diagram:'node-tree', globe:'global-line',
  disclosure:'arrow-right-s-line', loading:'loader-4-line', terminal:'terminal-box-line',
  search:'search-line', fetch:'download-cloud-line', read:'file-text-line', write:'file-add-line',
  edit:'file-edit-line', todos:'checkbox-line', branch:'git-branch-line', wait:'time-line',
  memory:'brain-line', history:'history-line', question:'question-line', tool:'tools-line', filter:'filter-3-line',
  schedule:'calendar-schedule-line',
};
function icon(name, className = '') {
  return `<svg class="ri${className ? ' ' + className : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="${ICON_SPRITE}#ri-${name}"></use></svg>`;
}
const DISCLOSURE_ICON = icon(ICONS.disclosure, 'disclosure-icon');
const LOADING_ICON = icon(ICONS.loading, 'spin');
const COPY_BUTTON = icon(ICONS.copy) + '복사';
const COPIED_BUTTON = icon(ICONS.check) + '복사됨';
const CODE_BUTTON = icon(ICONS.code) + '코드';
const DIAGRAM_BUTTON = icon(ICONS.diagram) + '다이어그램';
document.querySelectorAll('[data-icon]').forEach(el =>
  el.insertAdjacentHTML('afterbegin', icon(ICONS[el.dataset.icon])));

// <img src> 와 WebSocket 업그레이드는 헤더를 못 붙인다. 쿼리스트링에 토큰을 실으면
// 접근로그·리퍼러에 남으므로, 브리지가 /api/web-token 에서 심어준 HttpOnly 쿠키를 쓴다.
const withTok = u => u;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json',
               ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}),
               ...(opts.headers || {}) },
  });
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { status: r.status, body: await r.text() });
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

// ─────────────────────────────────────────────── 폰트
// 본문 폰트는 브리지가 프록시한다 → 브라우저는 fonts.googleapis.com 을 직접 때리지 않고,
// 한 번 받은 조각은 브리지 캐시에 남아 다음엔 오프라인에서도 뜬다.
function applyFont(id) {
  const meta = S.fonts.find(f => f.id === id);
  if (meta?.stack) document.documentElement.style.setProperty('--font-body', meta.stack);
  let link = document.getElementById('fontcss');
  if (meta?.webfont) {
    if (!link) { link = document.createElement('link'); link.id = 'fontcss'; link.rel = 'stylesheet';
                 document.head.appendChild(link); }
    const href = '/api/font/css/' + id;
    if (!link.href.endsWith(href)) link.href = href;
  } else if (link) link.remove();
}

// 설정 화면에서만: 미리보기가 실제 폰트로 보이게 전 패밀리 CSS 를 한 번 로드한다.

let previewsLoaded = false;

// ─────────────────────────────────────────────── 마크다운
// 안드로이드 앱의 Markdown.kt 와 같은 범위: 문단·헤딩·리스트·코드·강조·링크·이미지.
// Aside 는 근거를 <citation refs="…">인용문</citation> 로 감싸서 뱉는다. 태그는 버리고 인용문만 남긴다.
const stripCitations = t => String(t)
  .replace(/<citation\b[^>]*>([\s\S]*?)<\/citation>/g, '$1')
  .replace(/<\/?citation\b[^>]*>/g, '')
  .replace(/<webfetch-citation\b[^>]*\/?>/g, '');

const isTableSep = l => /^\s*\|?[\s:-]*-{2,}[\s:|-]*\|?\s*$/.test(l) && l.includes('-');
const splitRow = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());

function md(src) {
  const lines = stripCitations(src).replace(/\r\n/g, '\n').split('\n');
  let out = '', para = [], i = 0;
  // 리스트는 스택으로 중첩을 관리한다. 평면 상태기계였을 때는 번호 리스트 밑에
  // 불렛이 끼면 ol 을 닫았다 열어서 번호가 매번 1로 리셋됐다 ("1. 1. 1." 버그).
  // 중첩 리스트는 부모 <li> "안"에 들어가므로, 안쪽을 닫아도 부모 li 는 열린 채 둔다.
  const lstack = [];                      // [{t:'ul'|'ol', ind, li:boolean}]
  const ltop = () => lstack[lstack.length - 1];
  const closeOne = () => { const s = lstack.pop(); if (s.li) out += '</li>'; out += `</${s.t}>`; };
  const flushP = () => { if (para.length) { out += '<p>' + inline(para.join('\n')) + '</p>'; para = []; } };
  const flushL = () => { while (lstack.length) closeOne(); };
  while (i < lines.length) {
    const L = lines[i];
    const fence = L.match(/^\s*```\s*([\w+-]*)\s*$/);
    if (fence) {
      flushP(); flushL();
      const lang = fence[1] || '', buf = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out += codeBlock(lang, buf.join('\n'));
      continue;
    }
    const img = L.trim().match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
    if (img) { flushP(); flushL();
      out += `<img src="${esc(withTok(img[2]))}" alt="${esc(img[1])}" loading="lazy">`;
      if (img[1]) out += `<div class="meta">${esc(img[1])}</div>`;
      i++; continue; }
    // 마크다운 표: 헤더행 + 구분행 + 본문행
    if (L.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1]) && L.trim().includes('|')) {
      flushP(); flushL();
      const head = splitRow(L); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(splitRow(lines[i++]));
      out += '<table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') +
             '</tr></thead><tbody>' +
             rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
             '</tbody></table>';
      continue;
    }
    if (/^\s*>\s?/.test(L)) {
      flushP(); flushL();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out += '<blockquote>' + md(buf.join('\n')) + '</blockquote>';
      continue;
    }
    if (/^\s*([-*_])\1{2,}\s*$/.test(L)) { flushP(); flushL(); out += '<hr>'; i++; continue; }
    const h = L.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushP(); flushL();
      const n = Math.min(h[1].length, 3);
      out += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    const b = L.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (b) {
      flushP();
      const ind = b[1].replace(/\t/g, '  ').length;
      const t = /\d/.test(b[2]) ? 'ol' : 'ul';
      while (lstack.length && ind < ltop().ind) closeOne();      // 얕아지면 안쪽부터 닫는다
      if (!lstack.length || ind > ltop().ind) {                  // 깊어지면 부모 li 안에 중첩
        const n = t === 'ol' ? parseInt(b[2], 10) : 1;
        out += n > 1 ? `<ol start="${n}">` : `<${t}>`;           // "3." 부터 시작해도 번호 유지
        lstack.push({ t, ind, li: false });
      } else if (ltop().t !== t) {                               // 같은 깊이에서 타입 전환
        closeOne();
        out += `<${t}>`; lstack.push({ t, ind, li: false });
      }
      const st = ltop();
      if (st.li) out += '</li>';
      out += `<li>${inline(b[3])}`; st.li = true;
      i++; continue;
    }
    // 들여쓴 이어지는 줄은 직전 항목의 연속이다. 여기서 리스트를 끊으면 번호가 1로 리셋된다.
    if (lstack.length && ltop().li && /^\s{2,}\S/.test(L)) { out += `<br>${inline(L.trim())}`; i++; continue; }
    if (!L.trim()) { flushP(); flushL(); i++; continue; }
    flushL(); para.push(L); i++;
  }
  flushP(); flushL();
  return out;
}

function inline(t) {
  let s = esc(t);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,
    (_, a, u) => `<img src="${esc(withTok(u))}" alt="${esc(a)}" loading="lazy">`);
  s = s.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g,
    (_, a, u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${a || esc(u)}</a>`);
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  return s;
}

// hljs 가 아는 언어일 때만 language- 클래스를 붙인다. 모르는 값이면 경고만 찍고 무시되기 때문.
function hlLang(lang) {
  if (!lang) return '';
  const l = String(lang).toLowerCase();
  return (window.hljs && hljs.getLanguage(l)) ? l : '';
}

function codeBlock(lang, body) {
  if ((lang || '').toLowerCase() === 'mermaid')
    return `<div class="mmd" data-src="${esc(body)}">` +
           `<div class="mmdbar"><span class="lang">mermaid</span>` +
           `<button class="mtg">${CODE_BUTTON}</button><button class="mcp">${COPY_BUTTON}</button></div>` +
           `<div class="mview"></div>` +
           `<pre class="code mmdsrc">${esc(body)}</pre></div>`;
  const l = hlLang(lang);
  return `<div class="codewrap"><div class="codebar">` +
    `<span class="lang">${esc(lang || 'text')}</span><button class="cp">${COPY_BUTTON}</button></div>` +
    `<pre class="code"><code${l ? ` class="language-${esc(l)}"` : ''}>${esc(body)}</code></pre></div>`;
}

// 툴 인자 본문도 언어를 알면 하이라이트한다 (repl=JS, bash=shell).
const TOOL_LANG = { repl: 'javascript', bash: 'bash' };

// ── mermaid ─────────────────────────────────────────────────────────
// 3.6MB 라 다이어그램이 실제로 등장할 때만 로드한다. 스트리밍 중에는
// innerHTML 이 매 msg 마다 다시 만들어지므로, 소스 해시 → SVG 캐시로
// 같은 다이어그램을 두 번 그리지 않는다. 파싱 실패(미완성 펜스 포함)는
// 조용히 코드 원문을 남긴다 — 스트리밍 중간 상태에서 에러를 띄우면 시끄럽다.
let mmdLib = null;           // null=미로드 · Promise=로딩 중 · object=준비됨
const mmdCache = new Map();  // src → svg (성공만 캐시)
let mmdSeq = 0;

function mmdLoad() {
  if (mmdLib) return mmdLib;
  mmdLib = new Promise(res => {
    const sc = document.createElement('script');
    sc.src = '/vendor/mermaid.min.js';
    sc.onload = async () => {
      await document.fonts.ready;
      window.mermaid.initialize({
        startOnLoad: false, securityLevel: 'strict',
        theme: 'dark',
        // 'inherit'(Gowun Batang 세리프)는 mermaid 의 폭 측정이 한글에서 5~8px
        // 과소평가돼 라벨 오른쪽이 잘린다 (fonts.ready 대기로도 안 고쳐짐 — 실측).
        // 측정과 렌더가 일치하는 시스템 산세리프로 고정한다.
        themeVariables: { fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--font-ui').trim() },
      });
      res(window.mermaid);
    };
    sc.onerror = () => res(null);
    document.head.appendChild(sc);
  });
  return mmdLib;
}

async function renderMermaids(root) {
  const nodes = root.querySelectorAll('.mmd:not([data-done])');
  if (!nodes.length) return;
  const M = await mmdLoad();
  if (!M) return;
  for (const el of nodes) {
    if (!el.isConnected) continue;               // 그 사이 리렌더로 떨어져나감
    const src = el.dataset.src;
    let svg = mmdCache.get(src);
    if (svg === undefined) {
      try {
        ({ svg } = await M.render('mmd' + (++mmdSeq), src));
        mmdCache.set(src, svg);
      } catch {
        document.getElementById('dmmd' + mmdSeq)?.remove();  // mermaid 가 남기는 에러 노드
        continue;                                 // 실패 → 코드 원문 유지 (캐시 안 함 = 완성되면 재시도)
      }
    }
    if (!el.isConnected) continue;
    el.querySelector('.mview').innerHTML = svg;
    el.dataset.done = '1';
    if (mmdShowSrc.has(src)) {                    // 스트리밍 리렌더 후에도 토글 상태 유지
      el.classList.add('src');
      const b = el.querySelector('.mtg'); if (b) b.innerHTML = DIAGRAM_BUTTON;
    }
  }
}
const mmdShowSrc = new Set();                     // 코드 보기로 둔 다이어그램 (src 키)

let hljsReady = false;
function highlightNew(root) {
  if (!hljsReady || !window.hljs) return;
  root.querySelectorAll('code[class*="language-"]:not([data-hl])').forEach(el => {
    el.dataset.hl = '1';
    try { hljs.highlightElement(el); } catch {}
  });
}
window.addEventListener('DOMContentLoaded', () => {
  if (window.hljs) {
    hljs.configure({ ignoreUnescapedHTML: true, cssSelector: 'code[class*=language-]' });
    hljsReady = true;
    highlightNew(document);
  }
});

const TOOL_ICON = { repl:ICONS.code, bash:ICONS.terminal, websearch:ICONS.search, webfetch:ICONS.fetch,
  read_file:ICONS.read, write_file:ICONS.write, edit_file:ICONS.edit, write_todos:ICONS.todos,
  subagent:ICONS.branch, subagent_wait:ICONS.wait, memory_search:ICONS.memory,
  browsing_history_search:ICONS.history, history_search:ICONS.history, ask_user_question:ICONS.question,
  message_agent:ICONS.chats, routine_update:ICONS.schedule };

// ─────────────────────────────────────────────── 렌더
// ─────────────────────────────────────────────── 라우터
// 성격이 다른 두 가지를 분리한다.
//   A. 주소로 표현할 상태  — view · sessionId · 검색어. 공유·북마크·새로고침이 의미 있다.
//   B. 뒤로가기로 닫을 레이어 — 드로어 · 이미지 확대 · 탭 시트. 주소에 남으면 안 된다.
// 둘 다 history 엔트리를 만들되, B 는 URL 을 바꾸지 않는다(pushState 에 현재 URL 재사용).
// 이 구분 하나로 백버튼 사다리가 통째로 사라진다.
//
// 규율: applyState 는 절대 navigate 를 부르지 않는다. 그래야 루프가 안 생긴다.
//   navigate/pushLayer  → 히스토리를 밀고 applyState 호출
//   popstate            → applyState 만 호출

const VIEWS = ['chats', 'tabs', 'settings'];

function parseUrl(loc = location) {
  const path = loc.pathname.replace(/\/+$/, '') || '/';
  const sp = new URLSearchParams(loc.search);
  const st = { view: 'chats', sessionId: null, q: sp.get('q') || '', live: sp.get('live') === '1' };
  if (path === '/tabs') st.view = 'tabs';
  else if (path === '/settings') st.view = 'settings';
  else { const m = path.match(/^\/c\/([A-Za-z0-9_-]{1,64})$/); if (m) st.sessionId = m[1]; }
  return st;
}

function urlOf(st) {
  const path = st.view === 'tabs' ? '/tabs'
             : st.view === 'settings' ? '/settings'
             : st.sessionId ? '/c/' + st.sessionId : '/';
  const sp = new URLSearchParams();
  if (st.q) sp.set('q', st.q);
  if (st.view === 'tabs' && st.live) sp.set('live', '1');
  const qs = sp.toString();
  return path + (qs ? '?' + qs : '');
}

// 레이어(layer)는 일부러 빼둔다 — 주소로 표현하지 않는 상태다.
const curState = () => ({
  view: S.view, sessionId: S.sessionId,
  q: S.view === 'tabs' ? S.q : S.sq, live: S.liveOnly,
});

// 떠나기 직전 현재 엔트리에 스크롤 위치를 박는다.
// 이게 없으면 back 이 "돌아온" 게 아니라 "다시 연" 느낌이 난다.
function stampScroll() {
  const box = $('#chatScroll');
  const base = history.state || curState();
  history.replaceState({ ...base, scroll: box ? box.scrollTop : 0 }, '', location.href);
}

function navigate(patch, { replace = false } = {}) {
  stampScroll();
  const st = { ...curState(), ...patch };
  history[replace ? 'replaceState' : 'pushState'](st, '', urlOf(st));
  applyState(st);
}

// URL 을 바꾸지 않는 히스토리 엔트리. 뒤로가기로 닫히는 레이어용.
function pushLayer(layer) {
  stampScroll();
  const st = { ...curState(), layer };
  history.pushState(st, '', location.href);
  applyState(st);
}
// 레이어는 반드시 back 으로 닫는다. element.remove() 로 닫으면 유령 엔트리가 남아
// 다음 back 이 한 번 헛돈다 — 이런 구조에서 제일 흔한 실수다.
const closeLayer = () => history.back();

function applyState(st) {
  // 목표 상태에 없는 레이어는 전부 닫는다
  if (st.layer !== 'zoom') document.querySelector('.zoom')?.remove();
  if (st.layer !== 'sheet') closeTabPreview();
  document.body.classList.toggle('drawer', st.layer === 'drawer');

  const view = VIEWS.includes(st.view) ? st.view : 'chats';
  const viewChanged = S.view !== view;
  S.view = view;

  if (view === 'tabs') { S.q = st.q || ''; S.liveOnly = !!st.live; }
  else {
    S.sq = st.q || '';
    // loadedQ 가 null 인 최초 1회 + 검색어가 바뀔 때만. (!sessions.length 를 조건에 넣으면
    // 대화가 0건인 사용자는 화면을 옮길 때마다 재조회한다)
    if (S.loadedQ !== S.sq) { S.loadedQ = S.sq; loadSessions('reset'); }
  }

  if ((st.sessionId || null) !== S.sessionId) {
    if (st.sessionId) openSession(st.sessionId); else clearSession();
  }
  if (viewChanged && view === 'tabs' && !S.tabs.length) loadTabs();

  lastKey = ''; render();
  if (typeof st.scroll === 'number') requestAnimationFrame(() => {
    const box = $('#chatScroll'); if (box) box.scrollTop = st.scroll;
  });
}

addEventListener('popstate', e => applyState(e.state || parseUrl()));

function render() {
  $('#dot').className = 'dot ' + (!S.wsOpen ? '' : (S.health && !S.health.asideApp ? 'warn' : 'ok'));
  $('#sideTitle').textContent = S.view === 'tabs' ? '탭' : S.view === 'settings' ? '설정' : '대화';
  document.querySelectorAll('.seg').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  ({ chats: renderSessions, tabs: renderTabs, settings: renderSettings })[S.view]();
  renderChat();
}

let lastKey = '';

const DAY = 86400e3;
function grpOf(ms) {
  const now = new Date();
  const sod = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const d = new Date(ms);
  if (ms >= sod) return '오늘';
  if (ms >= sod - DAY) return '어제';
  if (ms >= sod - 6 * DAY) return '지난 7일';
  if (ms >= sod - 29 * DAY) return '지난 30일';
  return d.getFullYear() === now.getFullYear()
    ? `${d.getMonth() + 1}월` : `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
}

function renderSessions() {
  const el = $('#list');
  // innerHTML 을 매번 갈아끼우면 그리는 도중 들어온 클릭이 씹힌다. 바뀔 때만 다시 그린다.
  const key = 'S' + S.token.slice(0, 4) + S.sessionId + S.sq + S.cursor + S.loadingMore +
    S.total + S.matched + S.running + S.deletingId +
    S.sessions.map(x => x.id + x.updatedAt + x.unread + x.title + x.status).join('|') +
    (S.listErr || '');
  if (key === lastKey) return;
  lastKey = key;
  if (!S.token) return el.innerHTML = `<div class="empty">설정에서 토큰을 넣어주세요</div>`;

  // 검색창은 항상 둔다. 없으면 "목록이 30개뿐"으로 보이고, 있으면 전 구간을 찌를 수 있다.
  const search = `<div class="lsearch"><input id="sq" placeholder="전체 대화 검색"
        value="${esc(S.sq)}" enterkeyhint="search" autocomplete="off"></div>`;

  let body;
  if (!S.sessions.length) {
    body = `<div class="empty">${S.listErr ? esc(S.listErr)
      : (S.sq ? `"${esc(S.sq)}" 결과가 없습니다` : '대화가 없습니다')}</div>`;
  } else {
    let last = '';
    body = S.sessions.map(x => {
      const g = grpOf((x.mtime || 0) * 1000 || Date.parse(x.updatedAt) || Date.now());
      const head = g === last ? '' : `<div class="grp">${esc(g)}</div>`;
      last = g;
      const isRunning = x.status === 'running' || (x.id === S.sessionId && S.running);
      return head + `
    <div class="card ${x.id === S.sessionId ? 'on' : ''}" data-id="${esc(x.id)}">
    <button class="card-open">
      <div class="t">${x.unread ? '<i class="unread"></i>' : ''}
        <span class="txt">${esc(x.title)}</span></div>
      ${x.preview ? `<div class="p">${esc(x.preview.replace(/\n/g, ' '))}</div>` : ''}
      <div class="m">${x.cost ? '$' + x.cost.toFixed(4) : ''}
        ${x.tokens ? Math.round(x.tokens / 1000) + 'k tok' : ''}</div>
    </button>
    <button class="session-delete" data-delete="${esc(x.id)}"
      aria-label="${esc(x.title)} 대화 삭제" title="${isRunning ? '실행을 중단한 뒤 삭제해 주세요' : '대화 삭제'}"
      ${isRunning || S.deletingId ? 'disabled' : ''}>
      ${icon(ICONS.delete)}
    </button></div>`;
    }).join('');
  }

  // 남은 개수를 버튼에 적는다 — 몇 번을 더 눌러야 하는지 모르면 누르기가 망설여진다.
  const rest = Math.max(0, (S.matched || 0) - S.sessions.length);
  const foot = S.cursor
    ? `<button class="more" id="more" ${S.loadingMore ? 'disabled' : ''}>${
        S.loadingMore ? '불러오는 중…' : `더보기 · 남은 ${rest}개`}</button>`
    : (S.sessions.length
        ? `<div class="listend">${S.sq
            ? `검색 결과 ${S.matched}개 (전체 ${S.total}개 중)`
            : `전체 ${S.total}개`}</div>`
        : '');

  el.innerHTML = search + body + foot;
  restoreSearchFocus();
}

// 입력할 때마다 목록이 다시 그려지므로 포커스·캐럿을 되돌려준다.
let sqCaret = null;
function restoreSearchFocus() {
  if (sqCaret === null) return;

function renderTabs() {
  const el = $('#list');
  const key = 'T' + S.q + S.liveOnly + S.tabs.map(t => t.targetId + t.loaded + (t.lastAccessed || 0)).join('|');
  if (key === lastKey) return;
  lastKey = key;
  const live = S.tabs.filter(t => t.loaded).length;
  // 최근 사용(마지막 활성) 순. 크롬이 주는 시간 정보는 lastAccessed 뿐이다 —
  // 생성/편집 시각은 확장 API 에 없다. 없는 탭(중복 URL 미매칭)은 뒤로.
  const f = S.tabs.filter(t => (!S.liveOnly || t.loaded) &&
    (!S.q || (t.title || '').toLowerCase().includes(S.q) || (t.url || '').toLowerCase().includes(S.q)))
    .sort((a, b) => (b.lastAccessed || 0) - (a.lastAccessed || 0));
  el.innerHTML = `
    <div class="searchbar">
      <input id="q" placeholder="제목·URL 검색" value="${esc(S.q)}">
      <button class="btn" id="lo" aria-pressed="${S.liveOnly}">${icon(ICONS.filter)}${S.liveOnly ? '살아있음' : '전체'}</button>
    </div>
    <div class="meta" style="padding:0 2px 6px">${S.tabs.length}개 · 살아있음 ${live}</div>
    ` + f.map(t => `
    <button class="tabrow" data-id="${esc(t.targetId)}">
      ${t.loaded
        ? `<img class="thumb" data-src="/api/tabs/${esc(t.targetId)}/shot"
             data-fav="${esc(t.favicon || '')}">`
        : `<div class="fav">${t.favicon ? `<img src="${esc(t.favicon)}">` : icon(ICONS.globe)}</div>`}
      <div style="min-width:0;flex:1">
        <div class="t">${esc(t.title || t.url || '')}</div>
        <div class="h"><i class="${t.loaded ? 'live' : ''}"></i><span>${esc(host(t.url))}${
          t.active ? ' · 활성' : (t.loaded ? '' : ' · 잠듦')}${
          t.lastAccessed ? ' · ' + ago(t.lastAccessed) : ''}</span></div>
      </div>
    </button>`).join('');
  const q = $('#q');
  if (q) q.oninput = e => { S.q = e.target.value.toLowerCase(); renderTabs(); $('#q')?.focus(); };
  const lo = $('#lo');
  if (lo) lo.onclick = () => { S.liveOnly = !S.liveOnly; renderTabs(); };
  observeThumbs();
}

const host = u => { try { return new URL(u).host.replace(/^www\./, ''); } catch { return ''; } };
const ago = ms => {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return Math.floor(s / 86400) + '일 전';
};

function firstUserText(msgs) {
  for (const m of msgs || []) {
    if (m.role !== 'user') continue;
    const t = (m.blocks || []).filter(b => b.type === 'text').map(b => b.text).join(' ');
    const clean = t.replace(ATT_BLOCK, '').replace(/\s+/g, ' ').trim();
    if (clean) return clean;
  }
  return '';
}

function renderChat() {
  // 목록은 이제 30건씩만 로드된다 → 오래된 대화를 새로고침으로 바로 열면 목록에 없다.
  // 그럴 땐 첫 user 발화에서 제목을 만든다 (서버가 하는 것과 같은 규칙).
  const title = S.sessions.find(s => s.id === S.sessionId)?.title ||
    (S.sessionId ? (firstUserText(S.msgs).slice(0, 80) || '대화') : '새 대화');
  $('#chatTitle').textContent = title;
  document.title = (S.view === 'tabs' ? '탭' : S.view === 'settings' ? '설정' : title) + ' · Aside';
  $('#chatErr').textContent = S.err || '';
  const box = $('#msgs');
  const atBottom = box.parentElement.scrollTop + box.parentElement.clientHeight
                   > box.parentElement.scrollHeight - 120;
  const items = groupMessages(S.msgs);
  const one = (it, i) => itemHtml(it, S.running && i === items.length - 1 && it.kind === 'act');
  const pendingHtml = S.pending ? `<div class="user pending">${
        (S.pendingAtts || []).length
          ? `<div class="atts">${S.pendingAtts.map(f =>
              `<img src="/api/upload/${esc(f)}" alt="">`).join('')}</div>` : ''
      }${esc(S.pending)}</div>` : '';
  const workingHtml = S.running ? `<div class="working">${LOADING_ICON}작업 중…</div>` : '';
  // 전송한 턴은 스페이서(.turn min-height)로 감싼다 — 새 유저 메시지가 화면 상단으로
  // 올라오는 claude.ai 모션. 예전엔 역사가 지워져서 "우연히" 이렇게 보였는데,
  // 이제는 위로 스크롤하면 이전 내용이 그대로 있다.
  let cut = -1;
  if (S.pending || S.running || S.holdTurn)
    for (let i = items.length - 1; i >= 0; i--)
      if (items[i].kind === 'user') { cut = i; break; }
  const turnBody = (cut >= 0 ? items.slice(cut).map((it, j) => one(it, cut + j)).join('') : '')
    + pendingHtml + workingHtml;
  const wrap = (cut >= 0 || S.pending)
    ? `<div class="turn" style="min-height:${Math.max(0, box.parentElement.clientHeight - 140)}px">${turnBody}</div>`
    : turnBody;
  // #msgs 는 메시지가 올 때마다 통째로 다시 그려진다 → 열린 본문의 내부 스크롤도 보존한다.
  const keepScroll = new Map();
  box.querySelectorAll('details[data-k][open] > .body').forEach(b => {
    if (b.scrollTop) keepScroll.set(b.parentElement.dataset.k, b.scrollTop);
  });
  box.innerHTML = items.slice(0, cut >= 0 ? cut : items.length).map(one).join('') + wrap;
  box.querySelectorAll('details[data-k][open] > .body').forEach(b => {
    const t = keepScroll.get(b.parentElement.dataset.k);
    if (t) b.scrollTop = t;
  });
  box.querySelectorAll('.codebar .cp').forEach(b => b.onclick = () => {
    const code = b.closest('.codewrap')?.querySelector('code');
    if (!code) return;
    navigator.clipboard.writeText(code.textContent);
    b.innerHTML = COPIED_BUTTON; setTimeout(() => b.innerHTML = COPY_BUTTON, 1200);
  });
  highlightNew(box);
  box.querySelectorAll('.asst img, .user .atts img').forEach(im => im.onclick = () => zoom(im.src));
  renderMermaids(box);
  const sb = $('#send');
  sb.className = S.running ? 'stop' : '';
  sb.innerHTML = icon(S.running ? ICONS.stop : ICONS.send);
  sb.title = S.running ? '스트리밍 끊기 (실행 자체는 Aside 앱에서 중단)' : '보내기';
  sb.setAttribute('aria-label', sb.title);
  if (atBottom) box.parentElement.scrollTop = box.parentElement.scrollHeight;
}

// ── 턴 묶기 ────────────────────────────────────────────────────────
// claude.ai 실측 규칙: 한 어시스턴트 턴에서 "최종 답변 텍스트"가 나오기 전까지의
// 모든 툴 활동(생각·툴호출·툴결과)을 pill 하나로 접는다. 개수가 아니라 턴 단위다.
// 검색 3건도, 페이지읽기+검색처럼 종류가 섞여도 pill 하나. 텍스트가 나오면 거기서 끊긴다.
function groupMessages(msgs) {
  const items = [];
  let act = [];
  const flush = () => { if (act.length) { items.push({ kind: 'act', steps: act }); act = []; } };
  for (const m of msgs) {
    if (m.role === 'user') { flush(); items.push({ kind: 'user', m }); continue; }
    if (m.role === 'system' || m.role === 'toolResult') { act.push(m); continue; }
    const blocks = m.blocks || [];
    const textBlocks = blocks.filter(b => b.type === 'text' && (b.text || '').trim());
    const rest = blocks.filter(b => b.type !== 'text');
    if (rest.length) act.push({ ...m, blocks: rest });
    if (textBlocks.length) { flush(); items.push({ kind: 'answer', m: { ...m, blocks: textBlocks } }); }
  }
  flush();
  return items;
}

/** 접힘 pill 문구. 실행 중이면 현재진행형 + 지금 뭘 하는지 한 줄 (claude 와 같은 방식). */
function actLabel(steps, live) {
  const tools = [];
  let lastThink = '';
  let t0 = null, t1 = null;
  for (const m of steps) {
    if (m.ts) { t0 = t0 ?? m.ts; t1 = m.ts; }
    for (const b of (m.blocks || [])) {
      if (b.type === 'toolCall' && b.name) tools.push(b.name);
      if (b.type === 'thinking' && (b.text || '').trim())
        lastThink = String(b.text).split('\n').find(l => l.trim())?.replace(/\*/g, '').trim() || lastThink;
    }
    if (m.toolName) tools.push(m.toolName);
  }
  if (live) return lastThink ? `작업 중 · ${lastThink.slice(0, 60)}` : '작업 중…';
  const uniq = [...new Set(tools)];
  if (!uniq.length) {
    const sec = (t0 && t1) ? Math.max(1, Math.round((t1 - t0) / 1000)) : 0;
    return sec ? `${sec}초 동안 생각함` : '생각함';
  }
  const n = tools.length;
  const head = uniq.length === 1 ? uniq[0] : `도구 ${uniq.length}종`;
  return `${head} 실행함${n > 1 ? ` · ${n}단계` : ''}`;
}

// <details> 열림 상태는 DOM 이 아니라 S.det 에 둔다 (세션 id + 턴 첫 seq + 단계/블록 위치가 키).
const isOpen = (k, dflt) => S.det.has(k) ? S.det.get(k) : !!dflt;
const dAttr = (k, dflt) => `data-k="${esc(k)}"${isOpen(k, dflt) ? ' open' : ''}`;

function stepHtml(m, base, si) {
  const text = (m.blocks || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  if (m.role === 'system') return `<div class="sys">${esc(text.slice(0, 300))}</div>`;
  if (m.role === 'toolResult') {
    const head = (text.split('\n').find(l => l.trim()) || '').slice(0, 80);
    return `<details class="res ${m.isError ? 'err' : ''}" ${dAttr(`${base}/${si}`, m.isError)}>
      <summary>${DISCLOSURE_ICON}${m.isError ? '실패' : '결과'}${m.toolName ? ' · ' + esc(m.toolName) : ''}
        &nbsp;${esc(head)}</summary>
      <div class="body">${esc(text.slice(0, 20000))}</div></details>`;
  }
  return (m.blocks || []).map((b, bi) => {
    const k = `${base}/${si}.${bi}`;
    if (b.type === 'thinking') {
      const head = (String(b.text || '').split('\n').find(l => l.trim()) || '생각 중')
        .replace(/\*/g, '').slice(0, 90);
      return `<details class="think" ${dAttr(k)}><summary>${DISCLOSURE_ICON}${esc(head)}</summary>
        <div class="body">${esc(b.text || '(내용 없음)')}</div></details>`;
    }
    if (b.type === 'toolCall') {
      const a = b.args || {};
      const body = a.code || a.command || a.query || a.prompt || a.path || a.url || JSON.stringify(a, null, 1);
      const tl = hlLang(TOOL_LANG[b.name]);
      return `<details class="tool" ${dAttr(k)}><summary>${DISCLOSURE_ICON}<span class="chip">
        ${icon(TOOL_ICON[b.name] || ICONS.tool)}${esc(b.name || 'tool')}</span></summary>
        <div class="body"><code${tl ? ` class="language-${tl}"` : ''}>${esc(String(body))}</code></div>
        </details>`;
    }
    if (b.type === 'image')
      return `<img src="/api/media/${esc(b.mediaId)}" loading="lazy">`;
    return '';
  }).join('');
}

// 브리지가 프롬프트 앞에 붙인 "[첨부 이미지] - 이름 → 경로" 블록을 썸네일로 되돌린다.
const ATT_BLOCK = /^\[첨부 이미지\]\n((?:- .*\n)+)위 이미지를[^\n]*\n\n?/;
function splitAttachments(text) {
  const m = text.match(ATT_BLOCK);
  if (!m) return { body: text, atts: [] };
  const atts = m[1].trim().split('\n').map(l => {
    const mm = l.match(/^- (.*) → (.+\/([^/]+))$/);
    return mm ? { name: mm[1], file: mm[3] } : null;
  }).filter(Boolean);
  return { body: text.slice(m[0].length), atts };
}

function itemHtml(item, live) {
  if (item.kind === 'user') {
    const raw = (item.m.blocks || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    const { body, atts } = splitAttachments(raw);
    const thumbs = atts.length
      ? `<div class="atts">${atts.map(a =>
          `<img src="/api/upload/${esc(a.file)}" alt="${esc(a.name)}" loading="lazy">`).join('')}</div>`
      : '';
    return `<div class="user">${thumbs}${esc(body)}</div>`;
  }
  if (item.kind === 'answer')
    return `<div class="asst">${(item.m.blocks || []).map(b =>
      b.type === 'image' ? `<img src="/api/media/${esc(b.mediaId)}" loading="lazy">` : md(b.text || '')
    ).join('')}</div>`;
  // 툴 활동 — 접힘이 기본
  const base = `${S.sessionId}|${item.steps[0]?.seq}`;
  return `<details class="act${live ? ' live' : ''}" data-seq="${item.steps[0]?.seq}" ${dAttr(base)}>
    <summary>${DISCLOSURE_ICON}<span class="lbl">${esc(actLabel(item.steps, live))}</span></summary>
    <div class="actbody">${item.steps.map((m, si) => stepHtml(m, base, si)).join('')}</div></details>`;
}

function zoom(src) {
  const d = document.createElement('div');
  d.className = 'zoom'; d.innerHTML = `<img src="${esc(src)}">`;
  d.onclick = closeLayer; document.body.appendChild(d);
  pushLayer('zoom');
}

// ─────────────────────────────────────────────── 탭 상세
const TAB_PREVIEW_INTERVAL = 5000;
let tabPreview = null;
let activeTabCapture = null;

function captureTab(preview) {
  if (tabPreview !== preview) return Promise.resolve();
  const targetId = preview.tab.targetId;
  if (activeTabCapture) {
    if (activeTabCapture.targetId === targetId) return activeTabCapture.promise;
    return activeTabCapture.promise.then(() => captureTab(preview), () => captureTab(preview));
  }
  const path = '/api/tabs/' + encodeURIComponent(targetId) + '/shot?fresh=true&t=' + Date.now();
  const promise = fetch(path, {
    cache: 'no-store',
    headers: S.token ? { Authorization: 'Bearer ' + S.token } : {},
  }).then(async r => {
    if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), {
      status: r.status, body: await r.text(),
    });
    const blob = await r.blob();
    if (!blob.type.startsWith('image/')) throw new Error('이미지 응답이 아닙니다');
    return blob;
  });
  const capture = { targetId, promise };
  activeTabCapture = capture;
  promise.then(clearCapture, clearCapture);
  return promise;

  function clearCapture() {
    if (activeTabCapture === capture) activeTabCapture = null;
  }
}

function closeTabPreview() {
  const preview = tabPreview;
  if (!preview) {
    document.querySelector('dialog.mask')?.remove();
    return;
  }
  tabPreview = null;
  clearTimeout(preview.timer);
  if (preview.objectUrl) URL.revokeObjectURL(preview.objectUrl);
  if (preview.dialog.open) preview.dialog.close();
  preview.dialog.remove();
  requestAnimationFrame(() => {
    if (tabPreview) return;
    const target = preview.returnFocus?.isConnected ? preview.returnFocus : $('#browserPreview');
    target?.focus();
  });
}

async function updateTabPreview(preview, isManual = false) {
  if (tabPreview !== preview || preview.loading || (preview.paused && !isManual) || !preview.tab.loaded) return;
  preview.loading = true;
  preview.refresh.disabled = true;
  preview.status.className = 'preview-status';
  preview.status.innerHTML = LOADING_ICON + '미리보기 업데이트 중…';
  try {
    const blob = await captureTab(preview);
    if (tabPreview !== preview) return;
    const objectUrl = URL.createObjectURL(blob);
    try {
      await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = resolve; image.onerror = reject; image.src = objectUrl;
      });
    } catch {
      URL.revokeObjectURL(objectUrl);
      throw new Error('미리보기 이미지를 읽을 수 없습니다');
    }
    if (tabPreview !== preview) { URL.revokeObjectURL(objectUrl); return; }
    const previousUrl = preview.objectUrl;
    preview.objectUrl = objectUrl;
    preview.image.src = objectUrl;
    preview.image.hidden = false;
    preview.placeholder.hidden = true;
    if (previousUrl) URL.revokeObjectURL(previousUrl);
    preview.updatedAt = new Date();
    updateTabPreviewStatus(preview);
  } catch (e) {
    if (tabPreview !== preview) return;
    preview.status.className = 'preview-status error';
    preview.status.textContent = e.status === 409
      ? '탭이 잠들어 미리보기를 업데이트할 수 없어요.'
      : '미리보기를 업데이트하지 못했어요. 다시 시도해 주세요.';
  } finally {
    preview.loading = false;
    if (tabPreview === preview) {
      preview.refresh.disabled = false;
      clearTimeout(preview.timer);
      if (!preview.paused) preview.timer = setTimeout(() => updateTabPreview(preview), TAB_PREVIEW_INTERVAL);
    }
  }
}

function updateTabPreviewStatus(preview) {
  const time = preview.updatedAt?.toLocaleTimeString('ko-KR', {
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
  preview.status.className = 'preview-status';
  preview.status.textContent = `${preview.paused ? '자동 업데이트 일시정지' : '자동 업데이트 중'}${
    time ? ' · 마지막 업데이트 ' + time : ''}`;
}

function showTab(t, returnFocus = document.activeElement) {
  if (!t) return;
  closeTabPreview();
  const isLoaded = t.loaded !== false;
  const m = document.createElement('dialog');
  m.className = 'mask';

// ─────────────────────────────────────────────── 데이터
const showErr = e => { S.err = e.body || e.message; render(); };

const PAGE = 30;

// mode: 'reset'  검색어가 바뀌었다 → 목록·커서를 버리고 1페이지부터
//       'merge'  주기 새로고침 → 1페이지만 다시 받아 기존에 덮어쓴다 (더보기 진척 유지)
//       'more'   더보기 → 커서 이후를 이어붙인다
async function loadSessions(mode = 'merge') {
  if (mode === 'more' && (!S.cursor || S.loadingMore)) return;
  if (mode === 'reset') { S.sessions = []; S.cursor = null; }
  const p = new URLSearchParams({ limit: String(PAGE) });
  if (mode === 'more') p.set('cursor', S.cursor);
  if (S.sq.trim()) p.set('q', S.sq.trim());
  const mine = ++loadSeq;                       // 늦게 돌아온 이전 요청이 덮어쓰지 못하게
  const wasEmpty = !S.sessions.length;
  S.loadingMore = (mode === 'more'); render();
  try {
    const r = await api('/api/sessions?' + p);
    if (mine !== loadSeq) return;
    const previous = mode === 'more' ? S.sessions
      : (mode === 'merge' && r.nextCursor
          ? S.sessions.filter(x => (x.mtime || 0) < (r.items.at(-1)?.mtime || 0)) : []);
    const by = new Map(previous.map(x => [x.id, x]));
    for (const x of r.items) by.set(x.id, x);   // 서버 값이 항상 이긴다
    S.sessions = [...by.values()].sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
    // merge 는 1페이지만 덧칠하는 새로고침이다. 커서를 건드리면 끝까지 펼쳐둔 목록에
    // '더보기' 가 되살아나거나, 중간까지 본 진척이 1페이지로 되감긴다.
    if (mode !== 'merge' || wasEmpty || !r.nextCursor) S.cursor = r.nextCursor;
    S.total = r.total; S.matched = r.matched; S.listErr = null;
  } catch (e) {
    if (mine !== loadSeq) return;
    S.listErr = e.status === 401 ? '토큰이 틀렸습니다 (설정 확인)' : (e.message);
  }
  S.loadingMore = false;
  render();
}
let loadSeq = 0;
async function loadTabs(force) {
  try { S.tabs = (await api('/api/tabs?refresh=' + !!force)).tabs; S.err = null; }
  catch (e) { showErr(e); }
  render();
}
async function poll() { try { S.health = await api('/api/health'); render(); } catch {} }

// run.done 은 그 순간 구독 중인 소켓에만 간다. 새로고침·백그라운드로 놓칠 수 있으므로
// 실행 중일 때만 가벼운 상태 확인을 돌린다. (데몬이 보는 상태라 브리지 재기동에도 정확하다)
async function pollRunning() {
  if (!S.running || !S.sessionId || !S.token) return;
  try {
    const r = await api(`/api/sessions/${S.sessionId}/status`);
    if (!r.running && S.running) {
      S.running = false; S.pending = null;
      const m = await api(`/api/sessions/${S.sessionId}/messages?tail=400`);
      S.msgs = m.messages; S.nextSeq = m.nextSeq; S.offset = m.offset;
      loadSessions(); render();
    }
  } catch {}
}
setInterval(pollRunning, 6000);
function refreshAll() { loadSessions(); if (S.view === 'tabs') loadTabs(); poll(); }

// 아래 둘은 "적용" 만 한다. 히스토리는 navigate/applyState 가 책임진다.
async function openSession(id) {
  if (S.sessionId && S.sessionId !== id) sendWhenConnected({ op: 'unsub', sessionId: S.sessionId });
  S.sessionId = id; S.msgs = []; S.pending = null; S.err = null; S.holdTurn = false;
  localStorage.setItem('lastSession', id);
  render();
  try {
    const r = await api(`/api/sessions/${id}/messages?tail=400`);
    if (S.sessionId !== id) return;                 // 그새 다른 데로 갔으면 버린다
    S.msgs = r.messages; S.nextSeq = r.nextSeq; S.offset = r.offset; S.running = r.running;
    // 죽은 딥링크: push 하면 back 이 죽은 URL 로 되돌아가므로 replace 로 지운다.
    if (!r.messages.length && !r.running) {
      clearSession(); S.err = '그 대화를 찾을 수 없습니다';
      history.replaceState(curState(), '', urlOf(curState())); render(); return;
    }
  } catch (e) { showErr(e); }
  sendWhenConnected({ op: 'sub', sessionId: id, fromSeq: S.nextSeq, fromOffset: S.offset });
  render();
}

function clearSession() {
  if (S.sessionId) sendWhenConnected({ op: 'unsub', sessionId: S.sessionId });
  S.sessionId = null; S.msgs = []; S.running = false; S.pending = null; S.err = null; S.holdTurn = false;
  localStorage.removeItem('lastSession');
}

function newChat() { navigate({ view: 'chats', sessionId: null }); $('#draft').focus(); }

function removeSession(id) {
  const hasSession = S.sessions.some(x => x.id === id);
  if (!hasSession && S.sessionId !== id) return;
  ++loadSeq;
  S.loadingMore = false;
  S.sessions = S.sessions.filter(x => x.id !== id);
  if (hasSession) { S.total = Math.max(0, S.total - 1); S.matched = Math.max(0, S.matched - 1); }
  if (S.sessionId === id) navigate({ sessionId: null }, { replace: true });
  loadSessions(); render();
}

let deleteTarget = null;
const deleteDialog = $('#deleteDialog'), deleteConfirm = $('#deleteConfirm');
const deleteCancel = $('#deleteCancel'), deleteError = $('#deleteError');
const deleteButton = deleteConfirm.innerHTML;
function confirmDelete(session) {
  if (!session || S.deletingId) return;

}
deleteCancel.onclick = () => deleteDialog.close();
deleteDialog.addEventListener('close', () => { deleteTarget = null; });
deleteDialog.addEventListener('cancel', e => { if (S.deletingId) e.preventDefault(); });
deleteConfirm.onclick = async () => {
